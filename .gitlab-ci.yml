variables:
  DEBUG_DIR: "build_debug"
  RELEASE_DIR: "build_release"
  CPU_BUILD: 4
  CPU_SIM: 4
  INSTALL_PATH: "~/.local"
  GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_COMMIT_SHA/$CI_PROJECT_NAME

stages:
  - build
  - build.tests
  - run.tests
  - trigger

before_script:
  - echo "CI_BUILDS_DIR" $CI_BUILDS_DIR
  - echo "CI_JOB_ID" $CI_JOB_ID
  - echo "CI_COMMIT_SHA" $CI_COMMIT_SHA
  - echo "CI_PROJECT_NAME" $CI_PROJECT_NAME
  - echo "GIT_CLONE_PATH" $GIT_CLONE_PATH
  - mkdir -p ${DEBUG_DIR}
  - mkdir -p ${RELEASE_DIR}
  - export OMP_NUM_THREADS=${CPU_SIM}

build-debug:
  stage: build
  script:
    - cd ${DEBUG_DIR}
    - cmake .. -DCMAKE_CXX_FLAGS="-g -O1 -fsanitize=address -Wall -Wpedantic -pedantic-errors -Wextra --coverage"
    - make -j ${CPU_BUILD}

build-tests:
  variables: 
    GIT_CLEAN_FLAGS: -ffdx -e ${DEBUG_DIR}
  stage: build.tests
  needs: [build-debug]
  script:
    - cd ${DEBUG_DIR}
    - cmake .. -DTADAH_ENABLE_OPENMP=ON -DTADAH_BUILD_TESTS=ON -DCMAKE_CXX_FLAGS="--coverage -g -O1"
    - make -j ${CPU_BUILD}
    - rm -rf _deps
    - find . -name "*.a" -exec rm {} +
    - find . -name "*.o" -exec rm {} +
  artifacts:
    paths:
      - "${DEBUG_DIR}"

run-tests-1:
  stage: run.tests
  needs: [build-tests]
  script:
    - cd ${DEBUG_DIR}
    - make test
    - gcovr --exclude='.*/Eigen/.*' --exclude='.*/catch2/.*' --exclude='.*/tests/.*' --exclude='.*/CLI11/.*' --exclude='.*/toml11/.*'  --exclude='.*/CMakeFiles/.*' -r ..
  coverage: /^TOTAL.*\s+(\d+\%)$/

build-release-shared:
  stage: build
  script:
    - cd ${RELEASE_DIR}
    - cmake .. -DCMAKE_BUILD_TYPE=Release -DTADAH_ENABLE_OPENMP=ON
    - make -j ${CPU_BUILD}

build-release-static:
  stage: build
  needs: [build-release-shared]
  script:
    - cd ${RELEASE_DIR}
    - cmake .. -DCMAKE_BUILD_TYPE=Release -DTADAH_ENABLE_OPENMP=ON -DBUILD_SHARED_LIBS=OFF
    - make -j ${CPU_BUILD}

trigger_job:
  stage: trigger
  needs: [run-tests-1, build-release-shared, build-release-static]
  trigger:
    project: tadah/tadah.mlip
  # GitLab bug:
  # https://gitlab.com/gitlab-org/gitlab/-/issues/220047
  # Workaround:
  inherit:
    variables: false # this job won't inherit any variables
  variables: # variables set by this job will still be passed to the child-pipeline
    inherit: "This comes from the parent pipeline"