variables:
  GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_COMMIT_SHA/$CI_PROJECT_NAME
  
stages:
  - build.debug
  - run.unit.tests
  - build_release
  - run.functional.tests
  - trigger

before_script:
  - mkdir -p ${DEBUG_DIR}
  - mkdir -p ${RELEASE_DIR}
  - export PATH=$PATH:${INSTALL_PATH}/bin
  - export CPATH=$CPATH:${INSTALL_PATH}/include
  - export LIBRARY_PATH=$LIBRARY_PATH:${INSTALL_PATH}/lib
  - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:${INSTALL_PATH}/lib
  - export OMP_NUM_THREADS=${CPU_SIM}

build-debug-tests:
  stage: build.debug
  script:
    - cd ${DEBUG_DIR}
    - cmake .. -DCMAKE_CXX_FLAGS="-g -O1 -fsanitize=address -Wall -Wpedantic -pedantic-errors -Wextra --coverage"
               -DCMAKE_INSTALL_PREFIX=${INSTALL_PATH}  -DTADAH_ENABLE_OPENMP=ON -DTADAH_BUILD_TESTS=ON
    - make -j ${CPU_BUILD}
    - rm -rf _deps
    - find . -name "*.a" -exec rm {} +
    - find . -name "*.o" -exec rm {} +
  artifacts:
    paths:
      - "${DEBUG_DIR}"

run-tests-1:
  stage: run.unit.tests
  dependencies: [build-debug-tests]
  script:
    - cd ${DEBUG_DIR}
    - make test
    - gcovr --exclude='.*/Eigen/.*' --exclude='.*/catch2/.*' --exclude='.*/tests/.*' --exclude='.*/CLI11/.*' --exclude='.*/toml11/.*'  --exclude='.*/CMakeFiles/.*' -r ..
  coverage: /^TOTAL.*\s+(\d+\%)$/

build-release-shared:
  stage: build_release
  needs: [run-tests-1]
  script:
    - cd ${RELEASE_DIR}
    - cmake .. -DCMAKE_BUILD_TYPE=Release -DTADAH_ENABLE_OPENMP=ON -DCMAKE_INSTALL_PREFIX=${INSTALL_PATH}
    - make -j ${CPU_BUILD}

build-release-static:
  stage: build_release
  needs: [build-release-shared]
  script:
    - cd ${RELEASE_DIR}
    - cmake .. -DCMAKE_BUILD_TYPE=Release -DTADAH_ENABLE_OPENMP=ON -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=${INSTALL_PATH}
    - make -j ${CPU_BUILD}

trigger_job:
  stage: trigger
  needs: [run-tests-1, build-release-shared, build-release-static]
  trigger:
    project: tadah/tadah.mlip
  # GitLab bug:
  # https://gitlab.com/gitlab-org/gitlab/-/issues/220047
  # Workaround:
  inherit:
    variables: false # this job won't inherit any variables
  variables: # variables set by this job will still be passed to the child-pipeline
    inherit: "This comes from the parent pipeline"
