variables:
  DEBUG_DIR: "build_debug"
  RELEASE_DIR: "build_release"
  CPU_BUILD: 4
  CPU_SIM: 4
  INSTALL_PATH: "~/.local"

stages:
  - build
  - build.tests
  - run.tests
  - trigger

before_script:
  - git clone https://git.ecdf.ed.ac.uk/tadah/core.git ../CORE
  - git clone https://git.ecdf.ed.ac.uk/tadah/models.git ../MODELS
  - pwd
  - ls -l
  - mkdir -p ${DEBUG_DIR}
  - mkdir -p ${RELEASE_DIR}
  - export OMP_NUM_THREADS=${CPU_SIM}

build-debug:
  stage: build
  script:
    - cd ${DEBUG_DIR}
    - cmake .. -DCMAKE_CXX_FLAGS="-g -O1 -fsanitize=address -Wall -Wpedantic -pedantic-errors -Wextra --coverage"
    - make -j ${CPU_BUILD}

build-tests:
  variables: 
    GIT_CLEAN_FLAGS: -ffdx -e ${DEBUG_DIR}
  stage: build.tests
  needs: [build-debug]
  script:
    - cd ${DEBUG_DIR}
    - cmake .. -DTADAH_ENABLE_OPENMP=ON -DTADAH_BUILD_TESTS=ON -DCMAKE_CXX_FLAGS="--coverage -g -O1"
    - make -j ${CPU_BUILD}
    - rm -rf _deps
    - find . -name "*.a" -exec rm {} +
    - find . -name "*.o" -exec rm {} +
  artifacts:
    paths:
      - "${DEBUG_DIR}"

run-tests-1:
  stage: run.tests
  needs: [build-tests]
  script:
    - ta-dah --version
    - ta-dah --help

run-tests-2:
  stage: run.tests
  needs: [build-tests]
  script:
    - cd ${DEBUG_DIR}
    - make test
    - gcovr --exclude='.*/Eigen/.*' --exclude='.*/catch2/.*' --exclude='.*/tests/.*' --exclude='.*/CLI11/.*' --exclude='.*/toml11/.*'  --exclude='.*/CMakeFiles/.*' -r ..
  coverage: /^TOTAL.*\s+(\d+\%)$/

build-release-shared:
  stage: build
  script:
    - cd ${RELEASE_DIR}
    - cmake .. -DCMAKE_BUILD_TYPE=Release -DTADAH_ENABLE_OPENMP=ON
    - make -j ${CPU_BUILD}

build-release-static:
  stage: build
  needs: [build-release-shared]
  script:
    - cd ${RELEASE_DIR}
    - cmake .. -DCMAKE_BUILD_TYPE=Release -DTADAH_ENABLE_OPENMP=ON -DBUILD_SHARED_LIBS=OFF
    - make -j ${CPU_BUILD}

trigger_job:
  stage: trigger
  needs: [run-tests-1, run-tests-2, build-release-shared, build-release-static]
  trigger:
    project: tadah/tadah.mlip